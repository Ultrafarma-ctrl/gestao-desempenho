<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Desempenho — Nova Senha</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'DM Sans', sans-serif; }</style>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Nova Senha</h1>
      <p class="text-gray-500 text-sm mt-1">Digite sua nova senha para continuar</p>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
      <div id="loading" class="text-center text-gray-500 text-sm py-4">Verificando link...</div>

      <form id="update-form" class="hidden space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nova Senha</label>
          <input id="new-password" type="password" required minlength="8"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            placeholder="Mínimo 8 caracteres">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar Senha</label>
          <input id="confirm-password" type="password" required minlength="8"
            class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            placeholder="Repita a senha">
        </div>
        <div id="error-msg" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
        <button type="submit" id="submit-btn"
          class="w-full bg-indigo-600 text-white rounded-lg py-2.5 font-semibold hover:bg-indigo-700 transition-colors">
          Salvar nova senha
        </button>
      </form>

      <div id="invalid-msg" class="hidden text-center">
        <p class="text-sm text-red-600 mb-4">Link inválido ou expirado. Solicite um novo link de recuperação.</p>
        <a href="/login.html" class="text-indigo-600 text-sm hover:underline">Voltar ao login</a>
      </div>

      <div id="success-msg" class="hidden text-center">
        <svg class="w-12 h-12 text-green-500 mx-auto mb-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <p class="text-sm text-green-700 font-medium">Senha atualizada com sucesso!</p>
        <p class="text-xs text-gray-500 mt-1">Redirecionando...</p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL      = 'https://uafenvoiyltoziiechxg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhZmVudm9peWx0b3ppaWVjaHhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyODI2MzEsImV4cCI6MjA5Nzg1ODYzMX0.JfHu-8wZjpfnbXRbTFNWUyydN0fyxINBTbU5lGtBZTM';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loadingEl  = document.getElementById('loading');
    const formEl     = document.getElementById('update-form');
    const invalidEl  = document.getElementById('invalid-msg');
    const successEl  = document.getElementById('success-msg');
    const errorEl    = document.getElementById('error-msg');

    // Supabase envia o token de recovery no hash da URL
    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        loadingEl.classList.add('hidden');
        formEl.classList.remove('hidden');
      } else if (!session) {
        loadingEl.classList.add('hidden');
        invalidEl.classList.remove('hidden');
      }
    });

    document.getElementById('update-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn  = document.getElementById('submit-btn');
      const nova = document.getElementById('new-password').value;
      const conf = document.getElementById('confirm-password').value;

      errorEl.classList.add('hidden');

      if (nova !== conf) {
        errorEl.textContent = 'As senhas não coincidem.';
        errorEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Salvando...';

      const { error } = await sb.auth.updateUser({ password: nova });

      if (error) {
        errorEl.textContent = 'Erro: ' + error.message;
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Salvar nova senha';
        return;
      }

      formEl.classList.add('hidden');
      successEl.classList.remove('hidden');

      // Redireciona para o painel correto após 2 segundos
      setTimeout(async () => {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          const { data: u } = await sb.from('usuarios').select('perfil').eq('id', session.user.id).single();
          window.location.replace(u?.perfil === 'admin' ? '/admin/index.html' : '/gestor/index.html');
        } else {
          window.location.replace('/login.html');
        }
      }, 2000);
    });
  </script>
</body>
</html>
